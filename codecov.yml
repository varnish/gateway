coverage:
  status:
    project:
      default:
        target: auto
        # A few lines in this repo are only covered when goroutine scheduling
        # cooperates (disconnect-vs-response races in internal/varnishadm, for
        # one), so an unqualified "no drop at all" gate fails PRs for reasons
        # that have nothing to do with their contents. Allow that much drift
        # here; the patch status below still has no slack, so new code must
        # come with tests.
        threshold: 0.1%
    patch:
      default:
        target: auto

ignore:
  - "vendor/**"
  - "**/*_test.go"
  - "api/**"
  - "cmd/**"
  - "test/**"
  # Test support, not product code. internal/varnishtest drives a real
  # varnishd manager process and a varnishadm CLI for tests that need label
  # switching, which varnishd -C cannot do. It sits outside *_test.go so
  # several packages can share it, so Codecov counts it as production. It only
  # runs where varnishd and the ghost VMOD are present — the test-rust job —
  # and that job uploads no coverage, while test-go, which does, skips every
  # test built on it. Measured, it is ~260 lines that can never be hit.
  - "internal/varnishtest/**"
