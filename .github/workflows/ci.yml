name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: make fmt-check

      - name: Run Go vet
        run: go vet ./...

      - name: Cache envtest binaries
        uses: actions/cache@v5.1.0
        with:
          path: testbin
          key: envtest-1.31.0-${{ runner.os }}

      - name: Setup envtest binaries
        run: |
          make install-envtest
          mkdir -p testbin
          ./bin/setup-envtest use 1.31.0 --bin-dir testbin -p path

      - name: Run Go tests
        run: |
          KUBEBUILDER_ASSETS="$(pwd)/$(./bin/setup-envtest use 1.31.0 --bin-dir testbin -p path)" \
            go test -tags=integration -coverprofile=coverage.txt ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt

  test-rust:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-20261123-slim@sha256:8aa5a7bf5a1955bddbe7d74fcdd0b91ab30e74362a8b73af672b0481b35b44a0
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install Varnish and build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          VARNISH_VERSION=$(awk -F'"' '/^  varnishVersion:/{print $2; exit}' charts/varnish-gateway/values.yaml)
          apt-get update
          apt-get install -y curl gpg dirmngr
          mkdir -p /etc/apt/keyrings
          gpg --batch --keyserver hkps://keys.openpgp.org \
            --recv-keys 694566269779DFAC975ED9BDD0525EAE838B3344
          gpg --batch --armor --export 694566269779DFAC975ED9BDD0525EAE838B3344 \
            > /etc/apt/keyrings/varnish.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/varnish.gpg] https://packages.varnish-software.com/varnish/debian $VERSION_CODENAME main" \
            > /etc/apt/sources.list.d/varnish.list
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev git \
            "varnish=${VARNISH_VERSION}*" "varnish-dev=${VARNISH_VERSION}*"

      - name: Set up Rust
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rustup
          rustup toolchain install 1.92.0 --component clippy
          rustup default 1.92.0

      - name: Run clippy (warnings as errors)
        run: cd ghost && cargo clippy --release -- -D warnings

      - name: Build ghost VMOD in release mode
        run: cd ghost && cargo build --release

      - name: Run Rust unit tests in release mode
        run: cd ghost && cargo test --release --lib -- --skip vtc_

      - name: Run VTC integration tests
        run: cd ghost && cargo test --release vtc_

      # The Go tests under internal/vcl that drive a real varnishd (route VCL
      # compile, dispatch and the chaperone reconciler) skip when varnishd or
      # the ghost VMOD is absent, which is the case in test-go. This job has
      # both, so run them here against the pinned Varnish version.
      - name: Set up Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run varnishd-backed Go tests
        run: |
          go test -count=1 -v -run 'TestGeneratedVCLCompiles|TestRouteVCLRunsBeforeReturningGatewayVCL|TestReloaderAgainstVarnishd' ./internal/vcl/ 2>&1 | tee varnishd-go-tests.log
          # Fail if any of them skipped: the point of this job is that they run.
          if grep -q -- '--- SKIP' varnishd-go-tests.log; then
            echo "varnishd-backed Go tests skipped; varnishd or the ghost VMOD was not found" >&2
            exit 1
          fi

  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: '3.14.0'

      # Lints the chart, validates values.schema.json, and renders the chart
      # against every fixture in charts/varnish-gateway/test/fixtures. Catches
      # nil-pointer regressions from new top-level value keys without a
      # `(.Values.X).foo` style guard — the failure mode that broke
      # --reuse-values across the 0.18.5 → 0.20.0 upgrade.
      - name: Run helm-test
        run: make helm-test
