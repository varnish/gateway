metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: varnishcachepolicies.gateway.varnish-software.com
spec:
  group: gateway.varnish-software.com
  names:
    kind: VarnishCachePolicy
    listKind: VarnishCachePolicyList
    plural: varnishcachepolicies
    shortNames:
    - vcp
    singular: varnishcachepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.kind
      name: Target Kind
      type: string
    - jsonPath: .spec.targetRef.name
      name: Target Name
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VarnishCachePolicy configures caching behavior for routes through a Varnish Gateway.
          Without a VCP, all routes operate in pass-through mode (no caching).
          Attaching a VCP to a Gateway or HTTPRoute enables Varnish caching for those routes.

          VCP is an Inherited Policy per Gateway API conventions:
          - VCP on Gateway: default for all routes through that gateway
          - VCP on HTTPRoute: overrides gateway defaults for all rules in the route
          - VCP on HTTPRoute rule (via sectionName): overrides for that specific rule
          Most specific wins. Override is complete replacement, not field-level merging.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VarnishCachePolicySpec defines the desired caching behavior.
            properties:
              bypass:
                description: |-
                  Bypass defines conditions under which caching is bypassed even when
                  this policy is active. Matching requests get pass-through behavior.
                properties:
                  headers:
                    description: Headers lists header conditions that trigger cache
                      bypass.
                    items:
                      description: HeaderBypassCondition defines a header-based cache
                        bypass rule.
                      properties:
                        name:
                          description: Name is the header name to check.
                          type: string
                        valueRegex:
                          description: |-
                            ValueRegex is an optional regex pattern to match against the header value.
                            If omitted, any value (or presence) of the header triggers bypass.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                type: object
              cacheKey:
                description: CacheKey customizes what makes a cache entry unique.
                properties:
                  headers:
                    description: |-
                      Headers lists request headers to include in the cache key.
                      Similar to Vary, but controlled by the operator, not the origin.
                    items:
                      type: string
                    type: array
                  queryParameters:
                    description: QueryParameters controls which query parameters are
                      part of the cache key.
                    properties:
                      exclude:
                        description: 'Exclude is a denylist: these params are excluded
                          from the cache key.'
                        items:
                          type: string
                        type: array
                      include:
                        description: 'Include is an allowlist: only these params matter
                          for caching.'
                        items:
                          type: string
                        type: array
                    type: object
                type: object
              cacheRuleOverrides:
                description: |-
                  CacheRuleOverrides adjusts TTL, grace and keep for responses matching
                  request and/or response criteria. Rules are evaluated in order and the
                  first match wins; unset fields fall back to the policy-level values.
                items:
                  description: |-
                    CacheRuleOverride overrides caching parameters for matching requests/responses.
                    At least one of defaultTTL, forcedTTL, grace or keep must be set.
                    defaultTTL and forcedTTL are mutually exclusive.
                  properties:
                    defaultTTL:
                      description: |-
                        DefaultTTL is used when the origin does NOT send Cache-Control headers.
                        Mutually exclusive with ForcedTTL. If neither TTL field is set on this
                        rule, the top-level defaultTTL/forcedTTL pair applies (as a unit).
                        A negative value (e.g. -1s) means "do not cache": matching responses
                        become hit-for-miss. Zero and values under 1s in magnitude are rejected.
                      type: string
                    forcedTTL:
                      description: |-
                        ForcedTTL overrides origin Cache-Control entirely.
                        Mutually exclusive with DefaultTTL. If neither TTL field is set on this
                        rule, the top-level defaultTTL/forcedTTL pair applies (as a unit).
                        A negative value (e.g. -1s) means "do not cache": matching responses
                        become hit-for-miss. Zero and values under 1s in magnitude are rejected.
                      type: string
                    grace:
                      description: |-
                        Grace is how long to serve stale content while revalidating.
                        If unset, the top-level grace applies. Must be between 0s and 10 years
                        (87600h). Not applied to hit-for-miss (negative TTL) responses.
                      type: string
                    keep:
                      description: |-
                        Keep is how long to keep stale objects for serving when backends are sick.
                        If unset, the top-level keep applies. Must be between 0s and 10 years
                        (87600h). Not applied to hit-for-miss (negative TTL) responses.
                      type: string
                    match:
                      description: |-
                        Match selects the requests/responses this rule applies to.
                        All specified criteria must match. An empty match matches everything.
                      properties:
                        method:
                          description: |-
                            Method matches the request method. Unlike HTTPRoute method matching, GET and
                            HEAD match each other: a rule with method GET also matches HEAD requests and
                            vice versa, because Varnish fetches a HEAD miss as GET and stores one object.
                          enum:
                          - GET
                          - HEAD
                          - POST
                          - PUT
                          - DELETE
                          - CONNECT
                          - OPTIONS
                          - TRACE
                          - PATCH
                          type: string
                        path:
                          description: Path matches the request path.
                          properties:
                            type:
                              default: PathPrefix
                              description: |-
                                Type specifies how to match against the path Value.

                                Support: Core (Exact, PathPrefix)

                                Support: Implementation-specific (RegularExpression)
                              enum:
                              - Exact
                              - PathPrefix
                              - RegularExpression
                              type: string
                            value:
                              default: /
                              description: Value of the HTTP path to match against.
                              maxLength: 1024
                              type: string
                          type: object
                          x-kubernetes-validations:
                          - message: value must be an absolute path and start with
                              '/' when type one of ['Exact', 'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? self.value.startsWith(''/'')
                              : true'
                          - message: must not contain '//' when type one of ['Exact',
                              'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? !self.value.contains(''//'')
                              : true'
                          - message: must not contain '/./' when type one of ['Exact',
                              'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? !self.value.contains(''/./'')
                              : true'
                          - message: must not contain '/../' when type one of ['Exact',
                              'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? !self.value.contains(''/../'')
                              : true'
                          - message: must not contain '%2f' when type one of ['Exact',
                              'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? !self.value.contains(''%2f'')
                              : true'
                          - message: must not contain '%2F' when type one of ['Exact',
                              'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? !self.value.contains(''%2F'')
                              : true'
                          - message: must not contain '#' when type one of ['Exact',
                              'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? !self.value.contains(''#'')
                              : true'
                          - message: must not end with '/..' when type one of ['Exact',
                              'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? !self.value.endsWith(''/..'')
                              : true'
                          - message: must not end with '/.' when type one of ['Exact',
                              'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? !self.value.endsWith(''/.'')
                              : true'
                          - message: type must be one of ['Exact', 'PathPrefix', 'RegularExpression']
                            rule: self.type in ['Exact','PathPrefix'] || self.type
                              == 'RegularExpression'
                          - message: must only contain valid characters (matching
                              ^(?:[-A-Za-z0-9/._~!$&'()*+,;=:@]|[%][0-9a-fA-F]{2})+$)
                              for types ['Exact', 'PathPrefix']
                            rule: '(self.type in [''Exact'',''PathPrefix'']) ? self.value.matches(r"""^(?:[-A-Za-z0-9/._~!$&''()*+,;=:@]|[%][0-9a-fA-F]{2})+$""")
                              : true'
                        queryParams:
                          description: QueryParams matches request query parameters.
                          items:
                            description: |-
                              HTTPQueryParamMatch describes how to select a HTTP route by matching HTTP
                              query parameters.
                            properties:
                              name:
                                description: |-
                                  Name is the name of the HTTP query param to be matched. This must be an
                                  exact string match. (See
                                  https://tools.ietf.org/html/rfc7230#section-2.7.3).

                                  If multiple entries specify equivalent query param names, only the first
                                  entry with an equivalent name MUST be considered for a match. Subsequent
                                  entries with an equivalent query param name MUST be ignored.

                                  If a query param is repeated in an HTTP request, the behavior is
                                  purposely left undefined, since different data planes have different
                                  capabilities. However, it is *recommended* that implementations should
                                  match against the first value of the param if the data plane supports it,
                                  as this behavior is expected in other load balancing contexts outside of
                                  the Gateway API.

                                  Users SHOULD NOT route traffic based on repeated query params to guard
                                  themselves against potential differences in the implementations.
                                maxLength: 256
                                minLength: 1
                                pattern: ^[A-Za-z0-9!#$%&'*+\-.^_\x60|~]+$
                                type: string
                              type:
                                default: Exact
                                description: |-
                                  Type specifies how to match against the value of the query parameter.

                                  Support: Extended (Exact)

                                  Support: Implementation-specific (RegularExpression)

                                  Since RegularExpression QueryParamMatchType has Implementation-specific
                                  conformance, implementations can support POSIX, PCRE or any other
                                  dialects of regular expressions. Please read the implementation's
                                  documentation to determine the supported dialect.
                                enum:
                                - Exact
                                - RegularExpression
                                type: string
                              value:
                                description: Value is the value of HTTP query param
                                  to be matched.
                                maxLength: 1024
                                minLength: 1
                                type: string
                            required:
                            - name
                            - value
                            type: object
                          type: array
                        requestHeaders:
                          description: RequestHeaders matches request headers.
                          items:
                            description: |-
                              HTTPHeaderMatch describes how to select a HTTP route by matching HTTP request
                              headers.
                            properties:
                              name:
                                description: |-
                                  Name is the name of the HTTP Header to be matched. Name matching MUST be
                                  case-insensitive. (See https://tools.ietf.org/html/rfc7230#section-3.2).

                                  If multiple entries specify equivalent header names, only the first
                                  entry with an equivalent name MUST be considered for a match. Subsequent
                                  entries with an equivalent header name MUST be ignored. Due to the
                                  case-insensitivity of header names, "foo" and "Foo" are considered
                                  equivalent.

                                  When a header is repeated in an HTTP request, it is
                                  implementation-specific behavior as to how this is represented.
                                  Generally, proxies should follow the guidance from the RFC:
                                  https://www.rfc-editor.org/rfc/rfc7230.html#section-3.2.2 regarding
                                  processing a repeated header, with special handling for "Set-Cookie".
                                maxLength: 256
                                minLength: 1
                                pattern: ^[A-Za-z0-9!#$%&'*+\-.^_\x60|~]+$
                                type: string
                              type:
                                default: Exact
                                description: |-
                                  Type specifies how to match against the value of the header.

                                  Support: Core (Exact)

                                  Support: Implementation-specific (RegularExpression)

                                  Since RegularExpression HeaderMatchType has implementation-specific
                                  conformance, implementations can support POSIX, PCRE or any other dialects
                                  of regular expressions. Please read the implementation's documentation to
                                  determine the supported dialect.
                                enum:
                                - Exact
                                - RegularExpression
                                type: string
                              value:
                                description: |-
                                  Value is the value of HTTP Header to be matched.
                                  <gateway:experimental:description>
                                  Must consist of printable US-ASCII characters, optionally separated
                                  by single tabs or spaces. See: https://tools.ietf.org/html/rfc7230#section-3.2
                                  </gateway:experimental:description>

                                  <gateway:experimental:validation:Pattern=`^[!-~]+([\t ]?[!-~]+)*$`>
                                maxLength: 4096
                                minLength: 1
                                type: string
                            required:
                            - name
                            - value
                            type: object
                          type: array
                        responseHeaders:
                          description: ResponseHeaders matches response headers.
                          items:
                            description: |-
                              HTTPHeaderMatch describes how to select a HTTP route by matching HTTP request
                              headers.
                            properties:
                              name:
                                description: |-
                                  Name is the name of the HTTP Header to be matched. Name matching MUST be
                                  case-insensitive. (See https://tools.ietf.org/html/rfc7230#section-3.2).

                                  If multiple entries specify equivalent header names, only the first
                                  entry with an equivalent name MUST be considered for a match. Subsequent
                                  entries with an equivalent header name MUST be ignored. Due to the
                                  case-insensitivity of header names, "foo" and "Foo" are considered
                                  equivalent.

                                  When a header is repeated in an HTTP request, it is
                                  implementation-specific behavior as to how this is represented.
                                  Generally, proxies should follow the guidance from the RFC:
                                  https://www.rfc-editor.org/rfc/rfc7230.html#section-3.2.2 regarding
                                  processing a repeated header, with special handling for "Set-Cookie".
                                maxLength: 256
                                minLength: 1
                                pattern: ^[A-Za-z0-9!#$%&'*+\-.^_\x60|~]+$
                                type: string
                              type:
                                default: Exact
                                description: |-
                                  Type specifies how to match against the value of the header.

                                  Support: Core (Exact)

                                  Support: Implementation-specific (RegularExpression)

                                  Since RegularExpression HeaderMatchType has implementation-specific
                                  conformance, implementations can support POSIX, PCRE or any other dialects
                                  of regular expressions. Please read the implementation's documentation to
                                  determine the supported dialect.
                                enum:
                                - Exact
                                - RegularExpression
                                type: string
                              value:
                                description: |-
                                  Value is the value of HTTP Header to be matched.
                                  <gateway:experimental:description>
                                  Must consist of printable US-ASCII characters, optionally separated
                                  by single tabs or spaces. See: https://tools.ietf.org/html/rfc7230#section-3.2
                                  </gateway:experimental:description>

                                  <gateway:experimental:validation:Pattern=`^[!-~]+([\t ]?[!-~]+)*$`>
                                maxLength: 4096
                                minLength: 1
                                type: string
                            required:
                            - name
                            - value
                            type: object
                          type: array
                        status:
                          description: |-
                            Status matches the response status: an exact code ("404"), a class
                            ("5xx") or an inclusive range ("500-503"). Any entry matching suffices.
                          items:
                            pattern: ^([1-5][0-9]{2}|[1-5]xx|[1-5][0-9]{2}-[1-5][0-9]{2})$
                            type: string
                          type: array
                      type: object
                  type: object
                maxItems: 64
                type: array
              defaultTTL:
                description: |-
                  DefaultTTL is used when the origin does NOT send Cache-Control headers.
                  Origin Cache-Control takes precedence. Mutually exclusive with ForcedTTL.
                  A negative value (e.g. -1s) means "do not cache": matching responses
                  become hit-for-miss. Zero and values under 1s in magnitude are rejected.
                type: string
              forcedTTL:
                description: |-
                  ForcedTTL overrides origin Cache-Control entirely.
                  Use when the origin misbehaves or you need operator-level control.
                  Mutually exclusive with DefaultTTL.
                  A negative value (e.g. -1s) means "do not cache": matching responses
                  become hit-for-miss. Zero and values under 1s in magnitude are rejected.
                type: string
              grace:
                description: |-
                  Grace is how long to serve stale content while asynchronously revalidating.
                  Equivalent to stale-while-revalidate in HTTP semantics.
                  When unset, Varnish's default_grace (10s) is left untouched; an explicit
                  0s sets grace to zero. Must be between 0s and 10 years (87600h).
                  Not applied to hit-for-miss (negative TTL) responses.
                type: string
              keep:
                description: |-
                  Keep is how long to keep stale objects for serving when all backends are sick.
                  Equivalent to stale-if-error in HTTP semantics.
                  When unset, Varnish's default_keep (0s) is left untouched; an explicit
                  0s sets keep to zero. Must be between 0s and 10 years (87600h).
                  Not applied to hit-for-miss (negative TTL) responses.
                type: string
              targetRef:
                description: |-
                  TargetRef identifies the Gateway or HTTPRoute this policy applies to.
                  For per-rule targeting, set sectionName to the rule's name.
                properties:
                  group:
                    description: Group is the group of the target resource.
                    type: string
                  kind:
                    description: Kind is kind of the target resource.
                    type: string
                  name:
                    description: Name is the name of the target resource.
                    type: string
                  sectionName:
                    description: SectionName targets a specific named rule within
                      an HTTPRoute.
                    type: string
                required:
                - group
                - kind
                - name
                type: object
            required:
            - targetRef
            type: object
          status:
            description: VarnishCachePolicyStatus defines the observed state of VarnishCachePolicy.
            properties:
              ancestors:
                description: Ancestors is the list of ancestor objects that this policy
                  is relevant for.
                items:
                  description: VarnishCachePolicyAncestorStatus describes the status
                    of a policy with respect to an ancestor.
                  properties:
                    ancestorRef:
                      description: |-
                        AncestorRef corresponds with a ParentRef in the spec that this
                        PolicyAncestorStatus struct describes the status of.
                      properties:
                        group:
                          description: Group is the group of the target resource.
                          type: string
                        kind:
                          description: Kind is kind of the target resource.
                          type: string
                        name:
                          description: Name is the name of the target resource.
                          type: string
                        sectionName:
                          description: SectionName targets a specific named rule within
                            an HTTPRoute.
                          type: string
                      required:
                      - group
                      - kind
                      - name
                      type: object
                    conditions:
                      description: Conditions describe the status of the policy.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      type: array
                    controllerName:
                      description: ControllerName is the name of the controller that
                        wrote this status.
                      type: string
                  required:
                  - ancestorRef
                  - controllerName
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
