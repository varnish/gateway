---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: varnishvclpolicies.gateway.varnish-software.com
spec:
  group: gateway.varnish-software.com
  names:
    kind: VarnishVCLPolicy
    listKind: VarnishVCLPolicyList
    plural: varnishvclpolicies
    shortNames:
    - vvp
    singular: varnishvclpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target Name
      type: string
    - jsonPath: .status.ancestors[0].conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VarnishVCLPolicy attaches a VCL document to an HTTPRoute. Requests matched
          by the route are handled by that VCL, composed with the gateway's own VCL.

          API preview: not yet wired to the data plane.

          Attaching VCL to an HTTPRoute is equivalent to granting code execution
          inside the gateway pod. The feature is off unless the GatewayClassParameters
          of the route's GatewayClass set routeVCL.enabled=true.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VarnishVCLPolicySpec defines the VCL attached to an HTTPRoute.
            properties:
              targetRef:
                description: |-
                  TargetRef identifies the HTTPRoute this policy applies to. Only kind
                  HTTPRoute in group gateway.networking.k8s.io is accepted in this
                  version; the target must be in the policy's namespace. SectionName is
                  not supported and is rejected.
                properties:
                  group:
                    description: Group is the group of the target resource.
                    type: string
                  kind:
                    description: Kind is kind of the target resource.
                    type: string
                  name:
                    description: Name is the name of the target resource.
                    type: string
                  sectionName:
                    description: SectionName targets a specific named rule within
                      an HTTPRoute.
                    type: string
                required:
                - group
                - kind
                - name
                type: object
              vclConfigMapRef:
                description: |-
                  VCLConfigMapRef references a ConfigMap in the policy's own namespace
                  holding the VCL document. Cross-namespace references are refused.
                properties:
                  key:
                    description: |-
                      Key is the key in the ConfigMap data holding the VCL document.
                      Defaults to "route.vcl".
                    type: string
                  name:
                    description: Name is the name of the ConfigMap.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - targetRef
            - vclConfigMapRef
            type: object
          status:
            description: |-
              VarnishVCLPolicyStatus defines the observed state of VarnishVCLPolicy.

              Only conditions are reported for now. Slot assignment and per-pod compile
              results will be added here once policies are delivered to the data plane
              (route VCL phase P6).
            properties:
              ancestors:
                description: Ancestors is the list of ancestor objects that this policy
                  is relevant for.
                items:
                  description: |-
                    VarnishVCLPolicyAncestorStatus describes the status of a policy with respect
                    to an ancestor.
                  properties:
                    ancestorRef:
                      description: AncestorRef identifies the object this status entry
                        describes.
                      properties:
                        group:
                          description: Group is the group of the target resource.
                          type: string
                        kind:
                          description: Kind is kind of the target resource.
                          type: string
                        name:
                          description: Name is the name of the target resource.
                          type: string
                        sectionName:
                          description: SectionName targets a specific named rule within
                            an HTTPRoute.
                          type: string
                      required:
                      - group
                      - kind
                      - name
                      type: object
                    conditions:
                      description: |-
                        Conditions describe the status of the policy. Only Accepted is set in
                        this version; Programmed is reserved for when the VCL is delivered to
                        the data plane.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      type: array
                    controllerName:
                      description: ControllerName is the name of the controller that
                        wrote this status.
                      type: string
                  required:
                  - ancestorRef
                  - controllerName
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
